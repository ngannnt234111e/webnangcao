<div class="login-page">
  <div class="login-card">
    <h2>🔐 Đăng Nhập - Panda Store</h2>
    <div class="mode-toggle">
      <button [class.active]="loginMode === 'customer'" (click)="loginMode = 'customer'">👤 Khách hàng</button>
      <button [class.active]="loginMode === 'employee'" (click)="loginMode = 'employee'">👔 Nhân viên</button>
    </div>
    <div class="form-group">
      <label>Tên đăng nhập:</label>
      <input type="text" [(ngModel)]="username" placeholder="Nhập username..." />
    </div>
    <div class="form-group">
      <label>Mật khẩu:</label>
      <input type="password" [(ngModel)]="password" placeholder="Nhập mật khẩu..." />
    </div>
    @if (message) {
      <div class="message" [class.error]="isError">{{ message }}</div>
    }
    <div class="btn-row">
      <button (click)="login()" class="btn-login">Đăng Nhập</button>
      <button (click)="goBack()" class="btn-back">⬅ Quay lại</button>
    </div>
    <div class="hint-box">
      <p>Demo: 👤 <code>ngan / 123456</code> &nbsp;|&nbsp; 👔 <code>admin / 123456</code></p>
    </div>
  </div>
</div>
